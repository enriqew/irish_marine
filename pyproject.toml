[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-atlas-pipeline"
version = "0.1.0"
description = "Data pipeline that turns global marine biodiversity sources (OBIS aggregation API + raw OBIS GeoParquet, NOAA OISST) into static JSON artefacts for the interactive Marine Atlas dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Enrique Redonda" }]
keywords = ["marine", "biodiversity", "etl", "geospatial", "obis", "oisst", "duckdb"]

dependencies = [
    "httpx==0.28.1",
    "duckdb==1.5.4",
    "pandas==3.0.2",
    "xarray==2026.7.0",
    "netCDF4==1.7.4",
    "cftime==1.6.5",
    "numpy==2.4.4",
    "s3fs==2026.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
